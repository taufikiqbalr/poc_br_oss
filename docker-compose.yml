services:
  api:
    build: ./apps/api
    container_name: oss-br-api
    environment:
      PORT: 3402
      RULE_STORE_PATH: /app/data/rules-store.json
      DMN_ARTIFACT_DIR: /app/data/published-dmn
    volumes:
      - ./data:/app/data
    ports:
      - "3402:3402"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3402}
    container_name: oss-br-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3402}
    depends_on:
      - api
    ports:
      - "3400:3400"
